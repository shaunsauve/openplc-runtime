name: Tests

# Nothing in this repository used to run on a pull request: docker.yml fires on
# tag and branch pushes, windows-installer.yml on tags. Every "tests pass" in a
# review was therefore a claim about somebody's laptop, and a bootloader change
# without a VERSION bump got no automated testing at all -- the only `go test`
# was inside bootloader/Dockerfile, which only builds when the version is new.
on:
  pull_request:
  push:
    branches:
      - development
      - main
  workflow_dispatch:

# A new push supersedes an in-flight run for the same ref.
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bootloader:
    name: Bootloader (Go)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: bootloader/go.mod
          cache-dependency-path: bootloader/go.sum

      - name: gofmt
        working-directory: bootloader
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "::error::gofmt would change these files:"
            echo "$unformatted"
            exit 1
          fi

      - name: go vet
        working-directory: bootloader
        run: go vet ./...

      # -race because the bugs this package is prone to are concurrency ones:
      # the spec was being written by the updater while the API read it.
      - name: go test -race
        working-directory: bootloader
        run: go test -race -count=1 ./...

  webserver:
    name: Webserver (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements-dev.txt ]; then pip install -r requirements-dev.txt; fi
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install -e .
          # Every plugin's requirements, not just one.
          #
          # The plugin suites import their driver modules at collection time --
          # pymodbus, asyncua -- so a missing dependency is a COLLECTION error
          # that takes the whole run down rather than skipping those files.
          # scripts/run-pytest.sh installs only modbus_master's, which is why
          # it fails the same way when run by hand.
          for req in core/src/drivers/plugins/python/*/requirements.txt; do
            echo "Installing $req"
            pip install -r "$req"
          done
          pip install pytest pytest-asyncio

      # The plugin suites are excluded, and that is a statement about them
      # rather than about this gate.
      #
      # They are red on `development` today: 48 failures and 10 collection
      # errors across tests/pytest/plugins, modbus_master and modbus_slave,
      # reproducible on a clean checkout of the base branch. They expect the
      # per-plugin virtualenvs that install.sh builds, and in some cases a
      # running OPC-UA server. Gating on them would mean a check that can
      # never pass, which is a check everyone learns to ignore.
      #
      # What remains is 147 tests that do pass, covering the REST API,
      # compile pipeline and webserver behaviour this repository's own changes
      # touch. Repairing the plugin suites is real work and deserves its own
      # ticket; when it is done, delete these three lines.
      - name: pytest
        run: |
          pytest tests/pytest -q \
            --ignore=tests/pytest/plugins \
            --ignore=tests/pytest/modbus_master \
            --ignore=tests/pytest/modbus_slave

      # Plugin suites that DO pass, run explicitly.
      #
      # The blanket --ignore above is about suites that are red on the base
      # branch, but it also swallowed new plugin tests written against a green
      # bar -- so a PR could add a suite, watch the page go green, and have
      # nothing of its own run. That is worse than no gate, because it looks
      # like one.
      #
      # Named one file at a time on purpose: adding a suite here is a deliberate
      # act that says "this one passes on a clean checkout", and it cannot drag
      # in the red ones by accident. Delete this step when the blanket ignore
      # goes and everything under tests/pytest/plugins runs again.
      - name: pytest (plugin suites known green)
        run: |
          pytest -q \
            tests/pytest/plugins/opcua/test_string_types.py \
            tests/pytest/plugins/opcua/test_read_status.py

  corpus:
    name: Debug corpus (validator + harness)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # The corpus is a measuring instrument, and until this job existed nothing in CI ran any of
      # it: `grep -n "tests/debug" .github/workflows/*.yml` matched nothing, so an oracle could stop
      # validating and an assertion could stop failing and the page would stay green. All three
      # commands are pure-Python and stdlib-only (0.3 s of the 121 scenarios), which is why there
      # was never a reason not to run them.
      - name: validate every oracle
        run: python3 tests/debug/corpus/validate.py

      - name: the validator's own red/green proof
        run: python3 -m unittest tests/debug/corpus/test_validate.py

      # The runner against the fake endpoint: the seeded-defect DIVERGE rows, the identifier fold,
      # the event stream, and the diagnostic ledger row. Without this a matcher that stopped
      # matching would still be "passing" every scenario it is supposed to divide.
      - name: the harness
        run: python3 -m unittest discover tests/debug/harness

  corpus-build:
    name: Debug corpus (compile every program)
    runs-on: ubuntu-latest
    # Known-red and therefore visible rather than blocking: this job cannot pass yet, because the
    # compiler revision the corpus is authored against has never been pushed (see the checkout step
    # below). It is landed anyway, red, so the run that says so exists on every PR from now on --
    # a job that cannot pass is a job everyone learns to ignore, but a job that cannot pass *and
    # says why on every PR* is a ticket. Delete this line when the checkout below is configured.
    #
    # What it will report once configured, at this head: 25 programs OK and 3 XFAIL -- faults'
    # ADR(v) XOR, print-builtin's missing print builtin and retain-200's IECWStringVar <> char16_t[],
    # all three `build: expect-fail` against STruCpp 4e24129. build_all.sh exits 0 on that, so the
    # six oracles in those two programs are the corpus's known gap, not a regression.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # STruCpp's package.json requires node >= 22; ubuntu-latest ships 20.
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # NOT CONFIGURED ON PURPOSE, and the job fails here until it is -- rather than pinning a
      # compiler the corpus has never been built with.
      #
      # Every verdict in this corpus is a statement about a compiler revision: the payload's debug
      # info and probes come from STruCpp, not from this repository. The revision the corpus is
      # authored against is 4e24129, and it is 21 commits ahead of STruCpp's `development`, on a
      # LOCAL branch that has never been pushed -- `git ls-remote Autonomy-Logic/STruCpp` does not
      # contain it, and neither does the fork. So there is no ref this job can check out today.
      #
      # What it needs, whichever way it is solved: that revision reachable by `actions/checkout`
      # (push `debug-support` to a remote, or merge it, or vendor a tarball into the repo or an
      # artifact), then `repository:` and `ref:` filled in above -- pinned, never a branch, because
      # a moving compiler turns every verdict into a statement about whenever the job ran.
      # build_all.sh already records the head it built with into each program's build-record.txt and
      # prints it in its summary line, so a run of this job says which compiler it measured.
      - name: check out the STruCpp revision this corpus is authored against
        env:
          STRUCPP_REPO: ''  # e.g. Autonomy-Logic/STruCpp, or a fork that has 4e24129 pushed
          STRUCPP_REF: ''   # the pinned revision (4e2412965d8610e09c264f2e1bf869a09bfdc295)
        run: |
          if [ -z "$STRUCPP_REPO" ] || [ -z "$STRUCPP_REF" ]; then
            echo "::error::no STruCpp checkout is configured. The corpus's compiler revision" \
              "(4e24129) is on an unpushed local branch of ../STruCpp, so there is nothing to" \
              "fetch. See the comment above: push it, merge it, or vendor it, then set" \
              "STRUCPP_REPO and STRUCPP_REF."
            exit 1
          fi
          echo "::warning::STRUCPP_REPO=$STRUCPP_REPO STRUCPP_REF=$STRUCPP_REF" \
            "-> tests/debug/corpus/build_all.sh compiles with that compiler"

      # Named as a step so the job's failure says what is missing rather than "the job exited 1".
      - name: build_all.sh
        run: tests/debug/corpus/build_all.sh

  shell:
    name: Installer scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: shellcheck
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck
          shellcheck -S warning install.sh scripts/install-docker.sh \
            windows/provision-msys2.sh tests/integration/harness.sh

      # The Windows installer ships a compiled runtime inside an MSYS2 tree, so
      # its callers must ask install.sh for the source build. install.sh does
      # force native on MSYS2, but relying on that made a change to its
      # platform detection able to break the Windows build from another file.
      - name: The Windows build asks for a native install
        run: |
          set -euo pipefail
          fail=0
          for f in .github/workflows/windows-installer.yml windows/provision-msys2.sh; do
            if grep -qE '(^|[^-])\./install\.sh[[:space:]]*$' "$f"; then
              echo "::error file=$f::calls ./install.sh without --native"
              fail=1
            fi
          done
          # The image builds are the same story: there is no engine to install
          # inside a build layer.
          for f in Dockerfile Dockerfile.dev; do
            if ! grep -q 'install\.sh --native' "$f"; then
              echo "::error file=$f::must RUN ./install.sh --native"
              fail=1
            fi
          done
          [ "$fail" -eq 0 ] || exit 1
          echo "All installer callers ask for the build they need."
